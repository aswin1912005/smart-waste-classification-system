<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Smart Waste Classification
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f8;

            color:
                #222;
        }


        header {

            background:
                #1f2937;

            color:
                white;

            padding:
                25px;

            text-align:
                center;
        }


        header h1 {

            margin:
                0;

            font-size:
                30px;
        }


        header p {

            margin-top:
                8px;

            opacity:
                0.8;
        }


        .container {

            max-width:
                1100px;

            margin:
                30px auto;

            padding:
                20px;
        }


        .grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        300px,
                        1fr
                    )
                );

            gap:
                20px;
        }


        .card {

            background:
                white;

            border-radius:
                15px;

            padding:
                25px;

            box-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }


        .card h2 {

            margin-top:
                0;
        }


        #wasteImage {

            width:
                100%;

            max-height:
                500px;

            object-fit:
                contain;

            border-radius:
                12px;

            background:
                #eee;
        }


        .classification {

            font-size:
                32px;

            font-weight:
                bold;

            margin:
                20px 0;
        }


        .confidence {

            font-size:
                22px;

            margin:
                10px 0;
        }


        .reason {

            background:
                #f3f4f6;

            padding:
                15px;

            border-radius:
                10px;

            line-height:
                1.5;
        }


        .status {

            padding:
                12px;

            border-radius:
                8px;

            margin-bottom:
                10px;
        }


        .online {

            background:
                #dcfce7;
        }


        .offline {

            background:
                #fee2e2;
        }


        .processing {

            background:
                #fef3c7;
        }


        .network {

            line-height:
                1.8;
        }


        .small {

            color:
                #666;

            font-size:
                14px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        ♻️ Smart Waste Classification System
    </h1>

    <p>
        ESP32-CAM + Flask + Gemini AI
    </p>

</header>


<div class="container">


    <div class="grid">


        <!-- IMAGE -->

        <div class="card">

            <h2>
                📷 Latest Waste Image
            </h2>

            <img
                id="wasteImage"
                src=""
                alt="Waiting for image..."
            >

            <p
                id="imageStatus"
                class="small"
            >
                Waiting for ESP32-CAM...
            </p>

        </div>


        <!-- RESULT -->

        <div class="card">

            <h2>
                🤖 AI Classification
            </h2>


            <div
                id="classification"
                class="classification"
            >
                Waiting...
            </div>


            <div
                id="confidence"
                class="confidence"
            >
                Confidence: -
            </div>


            <h3>
                Reason
            </h3>


            <div
                id="reason"
                class="reason"
            >
                Waiting for Gemini analysis...
            </div>


            <p
                id="timestamp"
                class="small"
            >
                -
            </p>

        </div>


    </div>


    <!-- SERVER STATUS -->

    <div
        class="card"
        style="margin-top:20px"
    >

        <h2>
            🌐 System Status
        </h2>


        <div
            id="serverStatus"
            class="status processing"
        >
            Checking server...
        </div>


        <div class="network">

            <b>
                Flask Server:
            </b>

            <span id="serverAddress">
                -
            </span>

            <br>


            <b>
                ESP32-CAM:
            </b>

            <span id="cameraAddress">
                -
            </span>

            <br>


            <b>
                Gemini:
            </b>

            <span id="geminiStatus">
                -
            </span>

        </div>

    </div>


</div>


<script>


let lastImage = "";


async function updateLatest() {

    try {

        const response =
            await fetch(
                "/latest?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Latest request failed"
            );
        }


        const data =
            await response.json();


        // -------------------------------------
        // Classification
        // -------------------------------------

        const classification =
            data.classification ||
            "Waiting...";


        document.getElementById(
            "classification"
        ).textContent =
            classification;


        // -------------------------------------
        // Confidence
        // -------------------------------------

        let confidence = 0;


        if (
            data.confidence_percent !==
            undefined
        ) {

            confidence =
                data.confidence_percent;

        } else if (
            data.confidence !==
            undefined
        ) {

            confidence =
                Number(
                    data.confidence
                ) * 100;
        }


        document.getElementById(
            "confidence"
        ).textContent =
            "Confidence: " +
            confidence.toFixed(2) +
            "%";


        // -------------------------------------
        // Reason
        // -------------------------------------

        document.getElementById(
            "reason"
        ).textContent =
            data.reason ||
            "Waiting for analysis...";


        // -------------------------------------
        // Timestamp
        // -------------------------------------

        if (data.timestamp) {

            document.getElementById(
                "timestamp"
            ).textContent =
                data.timestamp;
        }


        // -------------------------------------
        // Image
        // -------------------------------------

        if (
            data.image &&
            data.image !== lastImage
        ) {

            lastImage =
                data.image;


            document.getElementById(
                "wasteImage"
            ).src =
                "/images/" +
                encodeURIComponent(
                    data.image
                ) +
                "?t=" +
                Date.now();


            document.getElementById(
                "imageStatus"
            ).textContent =
                "Latest image received.";
        }


    } catch (error) {

        console.error(
            error
        );

    }

}


async function updateHealth() {

    try {

        const response =
            await fetch(
                "/health?t=" +
                Date.now()
            );


        const data =
            await response.json();


        document.getElementById(
            "serverStatus"
        ).textContent =
            "🟢 Flask server online";


        document.getElementById(
            "serverStatus"
        ).className =
            "status online";


        document.getElementById(
            "serverAddress"
        ).textContent =
            data.server_ip +
            ":" +
            data.server_port;


        document.getElementById(
            "cameraAddress"
        ).textContent =
            data.camera_ip;


        document.getElementById(
            "geminiStatus"
        ).textContent =
            data.gemini;


    } catch (error) {

        document.getElementById(
            "serverStatus"
        ).textContent =
            "🔴 Flask server offline";


        document.getElementById(
            "serverStatus"
        ).className =
            "status offline";

    }

}


updateLatest();

updateHealth();


setInterval(
    updateLatest,
    1000
);


setInterval(
    updateHealth,
    5000
);


</script>


</body>

</html>
