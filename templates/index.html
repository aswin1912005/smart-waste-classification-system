<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Waste Classification</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .image-box {
            width: 100%;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .image-box img {
            max-width: 100%;
            max-height: 500px;
            display: none;
        }

        #waiting {
            color: #6b7280;
            font-size: 20px;
        }

        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            background: #f9fafb;
        }

        #classification {
            font-size: 32px;
            font-weight: bold;
            margin: 10px;
        }

        #confidence {
            font-size: 20px;
            margin: 10px;
        }

        #reason {
            font-size: 17px;
            color: #555;
            margin-top: 15px;
        }

        .bio {
            color: #15803d;
        }

        .nonbio {
            color: #dc2626;
        }

        .processing {
            color: #ea580c;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            color: #555;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>♻️ Smart Waste Classification</h1>

        <p>
            ESP32-CAM + Gemini AI
        </p>

    </div>


    <div class="container">

        <div class="card">

            <div class="image-box">

                <div id="waiting">
                    Waiting for waste...
                </div>

                <img id="wasteImage"
                     alt="Waste Image">

            </div>


            <div class="result">

                <div id="classification"
                     class="processing">

                    Waiting...

                </div>

                <div id="confidence">
                    Confidence: -
                </div>

                <div id="reason">
                    Place waste on the sensor.
                </div>

            </div>


            <div class="status">

                Server:
                <span id="serverStatus">
                    Checking...
                </span>

            </div>

        </div>

    </div>


<script>

let lastFilename = null;


// =====================================
// GET LATEST RESULT
// =====================================

async function updateResult() {

    try {

        const response = await fetch(
            "/latest?t=" + Date.now()
        );

        const data = await response.json();


        // -----------------------------
        // Image
        // -----------------------------

        if (data.filename) {

            if (lastFilename !== data.filename) {

                document.getElementById(
                    "wasteImage"
                ).src =
                    "/images/" +
                    data.filename +
                    "?t=" +
                    Date.now();

                document.getElementById(
                    "wasteImage"
                ).style.display = "block";

                document.getElementById(
                    "waiting"
                ).style.display = "none";

                lastFilename = data.filename;
            }
        }


        // -----------------------------
        // Classification
        // -----------------------------

        const classification =
            document.getElementById(
                "classification"
            );

        classification.textContent =
            data.classification || "Waiting...";


        // Remove old classes
        classification.className = "";


        if (
            data.classification ===
            "Biodegradable"
        ) {

            classification.classList.add("bio");

        }
        else if (
            data.classification ===
            "Non-Biodegradable"
        ) {

            classification.classList.add("nonbio");

        }
        else {

            classification.classList.add(
                "processing"
            );

        }


        // -----------------------------
        // Confidence
        // -----------------------------

        if (
            data.confidence !== undefined &&
            data.confidence !== null &&
            data.confidence > 0
        ) {

            const percent =
                (data.confidence * 100).toFixed(1);

            document.getElementById(
                "confidence"
            ).textContent =
                "Confidence: " +
                percent +
                "%";

        }
        else {

            document.getElementById(
                "confidence"
            ).textContent =
                "Confidence: -";

        }


        // -----------------------------
        // Reason
        // -----------------------------

        document.getElementById(
            "reason"
        ).textContent =
            data.reason || "";

    }
    catch (error) {

        console.error(error);

        document.getElementById(
            "serverStatus"
        ).textContent =
            "Offline";

    }

}


// =====================================
// SERVER HEALTH
// =====================================

async function checkServer() {

    try {

        const response =
            await fetch(
                "/health?t=" + Date.now()
            );

        const data =
            await response.json();

        document.getElementById(
            "serverStatus"
        ).textContent =
            data.server === "online"
                ? "Online"
                : "Offline";

    }
    catch {

        document.getElementById(
            "serverStatus"
        ).textContent =
            "Offline";

    }

}


// =====================================
// AUTO UPDATE
// =====================================

updateResult();
checkServer();

setInterval(updateResult, 1000);
setInterval(checkServer, 5000);

</script>

</body>

</html>
